---
name: "Semgrep checks"
"on":
  pull_request:
  push:

jobs:
  semgrep:
    name: "Run Semgrep"
    runs-on: ubuntu-latest

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - name: Run semgrep
        run: mise run semgrep
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        if: success() || failure()
        # always run even if the previous step fails
        with:
          check_name: Semgrep Checks
          report_paths: "results.xml"
