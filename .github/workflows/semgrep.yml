---
name: "Semgrep checks"
"on":
  pull_request:
  push:

jobs:
  semgrep:
    name: "Run Semgrep"
    runs-on: ubuntu-latest

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise toolchain
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Run semgrep
        run: mise run semgrep
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6
        if: success() || failure()
        # always run even if the previous step fails
        with:
          check_name: Semgrep Checks
          report_paths: "results.xml"
