---
name: Build Container

"on":
  push:
    branches:
      - main
  pull_request:
jobs:
  build_container:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        # https://github.com/docker/login-action/#github-container-registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # don't log in if we're not going to push!
        if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          install: true
      - name: vendor the things
        run: |
          mkdir -p .cargo
          cargo vendor >> .cargo/config.toml
      - name: Build and export to Docker
        id: build_and_export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # platforms: linux/amd64,linux/arm64
          context: .
          load: true
          tags: goatns:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: GITHUB_SHA=${GITHUB_SHA}
      - name: Test
        id: test
        run: |
          touch fullchain.pem
          touch privkey.pem
          docker run --rm \
            --mount type=bind,source=$(pwd)/fullchain.pem,target=/fullchain.pem \
            --mount type=bind,source=$(pwd)/privkey.pem,target=/privkey.pem \
            --mount type=bind,source=$(pwd)/goatns.example.json,target=/goatns.json \
            goatns:test \
            config-check --config goatns.json
